# Configuration for the fastfields wheel index (generate.py).

[index]
title = "fastfields wheel index"
base_url = "https://fastfields.github.io/whl"
org = "fastfields"

# Compute-backend buckets the index knows about. The bucket name is the wheel's
# local version label (PyTorch convention): "cpu", "cu118", "cu126", "cu130", ...
#
# Declaring a backend here does NOT publish it. Until a wheel bucketed into it
# is discovered, the backend is listed on the landing page as "planned -- not
# yet published" and serves no packages at all; only then does it become a real
# PEP 503 folder. This list is the roadmap, not the set of installable lanes.
#
# One CUDA lane per CUDA major, since the nvcc version sets which GPU
# architectures a wheel can reach: cu118 (Kepler/Maxwell -> Ada, driver ~450+),
# cu126 (Volta -> Hopper/Ada, driver ~525+), cu130 (Turing -> Blackwell,
# sm_75+, driver ~580+). The lanes are additive: cu130 reaches the newest
# architectures but drops everything before Turing, which is what cu118 is for.
#
# Policy (see README): PyPI ships the default (cu130 on Linux/Windows, cpu on
# macOS); this index additionally offers cpu + the other CUDA lines so users on
# older GPUs/drivers -- or who want to match the CUDA version of their
# PyTorch/CuPy install -- can pick a different one.
backends = ["cpu", "cu118", "cu126", "cu130"]

# PyPI-normalized project names served by the index.
#
# There are two Python distributions, not six. fastfields-numpy,
# fastfields-cupy, fastfields-torch and fastfields-helpers were merged into
# the `fastfields` distribution (fastfields#3), which now ships
# fastfields.{helpers,numpy,cupy,torch,auto} as one universal wheel; only the
# compiled bindings stayed separate, because they are the only thing here that
# needs a per-platform wheel matrix.
#
# The four absorbed names are deliberately NOT kept as aliases. Nothing was
# ever published under them -- no repo has cut a release, so the index has
# never served a wheel for any project -- so there is no installed user to
# keep working and nothing to redirect. Leaving them listed would have the
# generator advertise four projects that can never acquire a wheel.
projects = [
    "fastfields-dlpack",
    "fastfields",
]

# GitHub repos whose Releases hold the wheel assets (used by --from-releases).
[[sources.release]]
repo = "fastfields/fastfields-dlpack"
[[sources.release]]
repo = "fastfields/fastfields"
