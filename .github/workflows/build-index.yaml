name: Build and deploy wheel index

on:
  # Rebuild when the generator or config changes.
  push:
    branches: [main]
    paths:
      - generate.py
      - test_generate.py
      - sources.toml
      - .github/workflows/build-index.yaml
  # The index is push-triggered, not polled: each package repo's release
  # workflow fires a `repository_dispatch` here once it has uploaded its wheels
  # onto its own GitHub Release. See the reusable workflow in fastfields/.github
  # ("Ping the wheel index to rebuild"), which needs a WHL_DISPATCH_TOKEN with
  # `contents: write` on this repo -- the default GITHUB_TOKEN is scoped to the
  # calling repo and cannot fire a workflow here.
  repository_dispatch:
    types: [wheels-updated]
  # Manual rebuild, e.g. after fixing sources.toml or when a package repo could
  # not dispatch (missing token).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # generate.py uses tomllib (>=3.11)
      # Gate the deploy on the generator's own tests: they pin the two
      # invariants that make this index safe to pass to pip (a lane only serves
      # packages once a wheel exists; every link carries a #sha256=). A broken
      # generator must not reach Pages.
      - name: Test the generator
        run: python -m unittest test_generate -v
      - name: Generate PEP 503 index from GitHub Releases
        env:
          # Lets the API discovery read release assets (and raises rate limits).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails (exit 1) if any discovered wheel has no establishable sha256,
        # rather than publishing an unverifiable link.
        run: python generate.py --from-releases --out public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
